[project]
name = "ai-course-track"
version = "0.1.0"
description = "AI Scrum Master — a Teams-managed bot that runs the daily stand-up and writes back to Odoo"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11",
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
